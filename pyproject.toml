[project]
name = "sales-analysis"
version = "0.1.0"
description = "MSA-DATB07-03 team repository: a small sales analysis package"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
